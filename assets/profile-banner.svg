<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Data science. Public purpose.</title>
  <desc id="description">An editorial banner in deep navy and mint. An abstract field of data points resolves into connected lines.</desc>
  <defs>
