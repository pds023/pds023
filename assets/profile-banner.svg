  <text x="48" y="158" fill="#F3F5EF" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="650" letter-spacing="-2.5">Data science.</text>
  <text x="48" y="242" fill="#91D5BC" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="650" letter-spacing="-2.5">Public purpose.</text>
